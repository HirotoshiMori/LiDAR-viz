# 座標.txt の ○7a8（No7-8mm、7a8*.ply）
# point1 と point2: 断面を取りたい箇所を、盛土上の2点で指定する（元データ座標系 [x, y, z]、単位 m）
points:
  point1: [-0.055269, 0.435428, -1.194830]
  point2: [-0.04827, -0.224557, -0.760088]

plot:
  # 自動検知した変曲点を、断面距離の正方向（point2 側）へずらす量 [mm]
  inflection_shift_mm: 0
  # displacement_zoom（拡大した計測値）の縦軸範囲 [mm]
  ylim_displacement_zoom: [-860, -750]
