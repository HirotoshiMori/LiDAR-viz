# point1 と point2: 断面を取りたい箇所を、盛土上の2点で指定する（元データ座標系 [x, y, z]、単位 m）
points:
  point1: [0.007588, 0.066416, -0.893178]
  point2: [-0.008084, -0.234029, -0.639135]

# 床は水平から約55°。12°上限と Z[-1.8, -1.2] では床面が落ちる
ground:
  # 床候補を探すZの範囲 [m]。null なら全点
  z_range: [-2.3, -1.2]
  # 鉛直から許す床の最大傾斜 [度]。これより寝た面（壁など）は床にしない
  max_tilt_deg: 60

# 回転後の盛土表面は約 -0.56〜-0.33 m。共通の [-1.05, -0.55] だと上端だけが残る
cross_section:
  # 断面として残す補正後Zの範囲 [m]。null で範囲制限なし
  z_range: [-0.90, -0.20]

plot:
  # 自動検知した変曲点を、断面距離の正方向（point2 側）へずらす量 [mm]
  inflection_shift_mm: 0
  # displacement_zoom（拡大した計測値）の縦軸範囲 [mm]。このケースの盛土高さに合わせている
  ylim_displacement_zoom: [-600, -280]
