# 断面直線の2点（元データ座標系 [x, y, z]）
points:
  point1: [0.007588, 0.066416, -0.893178]   # 水槽の点（なければ土槽の護岸付近）
  point2: [-0.008084, -0.234029, -0.639135]   # 土層の点
  
# 床は水平から約55°。12°上限と Z[-1.8,-1.2] では赤丸の面が落ちる
ground:
  z_range: [-2.3, -1.2]
  max_tilt_deg: 60

# 回転後の盛土表面は約 -0.56〜-0.33 m。共通の [-1.05,-0.55] だと上端だけが残る
cross_section:
  z_range: [-0.90, -0.20]

# 図化パラメータ
plot:
  inflection_shift_mm: 0
  ylim_displacement_zoom: [-600, -280]
